name: CI

on:
  push:
    branches: [main, master]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gerbang:
    name: Gerbang rilis
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Pasang dependensi
        run: npm ci

      - name: Lint
        run: npm run lint -- --max-warnings=0

      - name: Pemeriksaan tipe
        run: npx tsc -b --force

      - name: Tes
        run: npm test

      - name: Build produksi
        run: npm run build

      - name: Panel kredensial developer tidak boleh ikut terbit
        run: |
          if grep -rl "bapperida.test" dist/ 2>/dev/null; then
            echo "::error::Akun developer ikut terbit ke bundel produksi. Lihat tiket P0-R03."
            exit 1
          fi
          echo "Bersih: tidak ada akun developer di dalam dist/."

  kerentanan:
    name: Kerentanan dependensi (informasi)
    runs-on: ubuntu-latest
    continue-on-error: true

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm audit --omit=dev
